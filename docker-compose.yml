services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGODB_URI: mongodb://mongo:27017/wbi
      NODE_ENV: production
    depends_on:
      - mongo
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  mongo_data:
  redis_data:
